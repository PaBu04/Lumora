[project]
name = "lsg"
version = "0.1.0"
description = "Neopixel Light Show Generator - music-synchronised LED shows for WLED controllers"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "zeroconf>=0.130",
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "pillow>=10",
]

[project.optional-dependencies]
# neural beat / downbeat tracking (CPU torch: add --extra-index-url https://download.pytorch.org/whl/cpu)
ml = [
    "torch>=2.4",
    "beat_this @ https://github.com/CPJKU/beat_this/archive/main.zip",
]
dev = [
    "pytest>=8",
    "playwright>=1.45",
    "ruff>=0.6",
]

[project.scripts]
lsg = "lsg.app:main"
lsg-wled-sim = "lsg.tools.wled_sim:main"

[project.gui-scripts]
# no console window on Windows; closing the app window stops the server
lsg-desktop = "lsg.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lsg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: end-to-end browser tests (need a built frontend and Playwright Chromium)"]
addopts = "-m 'not ui'"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E741",    # short names like l are fine in comprehensions
    "B008",    # FastAPI dependencies in defaults
    "SIM108",  # ternaries are not always clearer
    "RUF001",  # German text uses typographic characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"lsg/api.py" = ["B904"]  # HTTPException raised from a lookup failure on purpose
