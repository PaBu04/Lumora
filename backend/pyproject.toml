[project]
name = "lsg"
version = "0.1.0"
description = "Neopixel Light Show Generator - music-synchronised LED shows for WLED controllers"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "zeroconf>=0.130",
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "pillow>=10",
]

[project.optional-dependencies]
# neural beat / downbeat tracking (CPU torch: add --extra-index-url https://download.pytorch.org/whl/cpu)
ml = [
    "torch>=2.4",
    "beat_this @ https://github.com/CPJKU/beat_this/archive/main.zip",
]
dev = [
    "pytest>=8",
    "playwright>=1.45",
]

[project.scripts]
lsg = "lsg.app:main"
lsg-wled-sim = "lsg.tools.wled_sim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lsg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
