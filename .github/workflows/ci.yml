name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: System libraries (PortAudio for sounddevice)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check lumora tests
      - run: python -m ruff format --check lumora tests
      - run: python -m pytest -q
        env:
          LUMORA_AUDIO: "null"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - working-directory: backend
        run: python -m pytest -m ui -q
        env:
          LUMORA_AUDIO: "null"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: backend/tests/ui/artifacts
          if-no-files-found: ignore
